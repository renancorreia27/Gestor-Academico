<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Acadêmico - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card login-card" style="width: 100%; max-width: 450px;">
            <div class="login-header">
                <i class="bi bi-mortarboard-fill mb-2 d-block"></i>
                <h3 class="fw-bold mb-0">Gestor Acadêmico</h3>
                <p class="text-light opacity-75 small mt-1 mb-0">Acesse o seu painel de estudos</p>
            </div>
            
            <div class="login-body">
                <form action="/login" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted fw-bold small">E-MAIL</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control bg-light border-start-0" id="email" name="email" placeholder="Digite seu e-mail" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted fw-bold small">SENHA</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="Digite sua senha" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mt-2 mb-4">ENTRAR</button>
                </form>
                
                <div class="text-center mt-2 border-top pt-4">
                    <a href="/registrar" class="text-decoration-none text-muted fw-bold small d-inline-block me-3 hover-primary">
                        <i class="bi bi-person-plus me-1"></i> Criar uma conta
                    </a>
                    <span class="text-muted mx-1">|</span>
                    <a href="/esqueci_senha" class="text-decoration-none text-muted fw-bold small d-inline-block ms-3 hover-primary">
                        <i class="bi bi-key me-1"></i> Esqueci a senha
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
