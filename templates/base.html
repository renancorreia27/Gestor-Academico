<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor Acadêmico{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-2 d-none d-md-block sidebar p-3 d-flex flex-column">
                <h4 class="text-center mb-4 mt-2">
                    <i class="bi bi-mortarboard-fill me-2 text-primary"></i><br>
                    Gestor Acadêmico
                </h4>
                <hr class="text-secondary">
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}"><i class="bi bi-house-door-fill me-2"></i> Início</a>
                
                <a href="{{ url_for('semestres') }}" class="{% if request.endpoint == 'semestres' %}active{% endif %}"><i class="bi bi-journal-bookmark-fill me-2"></i> Semestres</a>
                <a href="{{ url_for('materias') }}" class="{% if request.endpoint == 'materias' %}active{% endif %}"><i class="bi bi-book-fill me-2"></i> Disciplinas</a>
                
                <div class="mt-auto">
                    <hr class="text-secondary">
                    <a href="{{ url_for('logout') }}" class="text-danger fw-bold text-decoration-none">
                        <i class="bi bi-box-arrow-right me-2"></i> Sair
                    </a>
                </div>
            </nav>

            <div class="col-md-10 ms-sm-auto col-lg-10 px-md-4 d-flex flex-column min-vh-100">
                
                {% block content %}{% endblock %}

                <footer class="text-center py-3 text-muted border-top mt-auto">
                    <p class="mb-0">&copy; 2026 Gestor Acadêmico. Todos os direitos reservados.</p>
                </footer>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
