<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor Acadêmico{% endblock %}</title>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <script>
        // Tema persistente antes da renderização para evitar oscilação de brilho
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    {% block head %}{% endblock %}
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            {% if not hide_sidebar %}
            <nav class="col-md-2 d-none d-md-block sidebar p-3 d-flex flex-column">
                <div class="sidebar-header text-center mb-4 mt-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-4 d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 54px; height: 54px;">
                        <i class="bi bi-mortarboard-fill fs-3"></i>
                    </div>
                    <h5 class="fw-bold text-white mb-0" style="letter-spacing: 0.5px; font-size: 1.1rem;">Gestor Acadêmico</h5>
                </div>
                <hr class="text-secondary">
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}"><i class="bi bi-house-door-fill me-2"></i> Início</a>
                
                <a href="{{ url_for('semestres') }}" class="{% if request.endpoint == 'semestres' %}active{% endif %}"><i class="bi bi-journal-bookmark-fill me-2"></i> Semestres</a>
                <a href="{{ url_for('materias') }}" class="{% if request.endpoint == 'materias' %}active{% endif %}"><i class="bi bi-book-fill me-2"></i> Disciplinas</a>
                <a href="{{ url_for('perfil') }}" class="{% if request.endpoint == 'perfil' %}active{% endif %}"><i class="bi bi-person-badge-fill me-2"></i> Meu Perfil</a>
                

            </nav>
            {% endif %}

            <div class="{% if hide_sidebar %}col-12 px-md-4{% else %}col-md-10 ms-sm-auto col-lg-10 px-md-4{% endif %} d-flex flex-column min-vh-100">
                
                {% block content %}{% endblock %}

                <footer class="text-center py-3 text-muted border-top mt-auto">
                    <p class="mb-0">&copy; 2026 Gestor Acadêmico. Todos os direitos reservados.</p>
                </footer>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('themeToggleBtn');
            const htmlEl = document.documentElement;
            
            function updateIcon(theme) {
                if (!toggleBtn) return;
                const icon = toggleBtn.querySelector('i');
                if (icon) {
                    if (theme === 'dark') {
                        icon.className = 'bi bi-sun-fill text-warning fs-5';
                    } else {
                        icon.className = 'bi bi-moon-fill text-secondary fs-5';
                    }
                }
            }

            // Inicializar o ícone com base no tema ativo
            const currentTheme = htmlEl.getAttribute('data-bs-theme') || 'light';
            updateIcon(currentTheme);
            
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const current = htmlEl.getAttribute('data-bs-theme') || 'light';
                    const newTheme = current === 'dark' ? 'light' : 'dark';
                    htmlEl.setAttribute('data-bs-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    updateIcon(newTheme);
                    
                    // Notificar o gráfico do Chart.js para atualizar suas cores
                    window.dispatchEvent(new Event('themeChanged'));
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
